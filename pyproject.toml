[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-fix-gamevisual-v2"
version = "2.1.7"
description = "Repair ASUS Armoury Crate GameVisual after screen replacement by computing the correct EDID-based ICC filename."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "star" }]
keywords = ["asus", "rog", "armoury-crate", "gamevisual", "icc", "edid"]

# Runtime dependencies are INTENTIONALLY empty: this tool ships as a zip for end
# users (gamers) who may have no pip at all. Everything is Python stdlib.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "basedpyright>=1.18"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# 务实规则集：E/F/W（pycodestyle + pyflakes）、I（import 排序）、UP（语法现代化）、B（常见 bug）。
# 本工具含大量中文全角标点与 CLI print，ruff 的 "ALL" 会误报上千条（RUF001/T201 等），故不启用 ALL。
select = ["E", "F", "W", "I", "UP", "B"]

[tool.basedpyright]
typeCheckingMode = "all"
include = ["gamevisual_fixer", "fix_gamevisual.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
