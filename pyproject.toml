[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-fix-gamevisual-v2"
version = "2.0.0"
description = "Repair ASUS Armoury Crate GameVisual after screen replacement by computing the correct EDID-based ICC filename."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "star" }]
keywords = ["asus", "rog", "armoury-crate", "gamevisual", "icc", "edid"]

# Runtime dependencies are INTENTIONALLY empty: this tool ships as a zip for end
# users (gamers) who may have no pip at all. Everything is Python stdlib.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "basedpyright>=1.18"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "SLF001", "ARG001", "D100", "D103"]

[tool.basedpyright]
typeCheckingMode = "all"
include = ["gamevisual_fixer", "fix_gamevisual.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
