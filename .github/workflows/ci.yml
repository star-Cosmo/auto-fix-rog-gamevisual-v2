name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装测试 / Lint 工具
        run: python -m pip install --upgrade pip pytest ruff

      - name: 运行单元测试
        run: python -m pytest -q

      - name: 代码检查 (ruff)
        run: python -m ruff check gamevisual_fixer fix_gamevisual.py tests
